title: Yoruba Terminology Dictionary
description: Modern Yoruba words for science, technology, mathematics, and education
author: Hakeem Oluwafemi Adeniyan
url: https://hakeemoadeniyan.github.io

# Dictionary plugin configuration
dictionaries:
  pages:
    dictionary:
      layout: dictionary
      permalink: /dictionary/:name/

# Build settings
plugins:
  - jekyll-dictionaries
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
